VRStabilizer.Name="VR Head Stabilizer"
VRStabilizer.Zoom="Crop zoom"
VRStabilizer.Zoom.Desc="Baseline crop zoom. Dynamic crop adds up to 5 percentage points to hide correction edges, then eases back. Uniform zoom preserves image proportions."
VRStabilizer.Strength="Strength"
VRStabilizer.Strength.Desc="How much of the computed correction is applied. 100% removes the vibration fully; lower values keep a fraction of it."
VRStabilizer.Smoothing="Smoothing"
VRStabilizer.Smoothing.Desc="How much motion is smoothed while the head is still. Higher removes slower vibrations but delays the start of intentional movements slightly."
VRStabilizer.Follow="Fast-motion follow"
VRStabilizer.Follow.Desc="Speed scale (pixels per frame) for reducing smoothing during turns. Outward motion near the crop boundary also follows progressively."
VRStabilizer.Recenter="Recenter time"
VRStabilizer.Recenter.Desc="How fast the stabilized view drifts back to the real view after a correction, in seconds."
VRStabilizer.MaxRotation="Max roll correction"
VRStabilizer.MaxRotation.Desc="Maximum head roll (tilt) correction in degrees. 0 disables rotation correction."
VRStabilizer.AnalysisWidth="Analysis resolution"
VRStabilizer.AnalysisWidth.Desc="Width of the downscaled image used for motion analysis. Higher is more precise but costs more CPU."
VRStabilizer.Bypass="Bypass (show original with the same zoom)"
VRStabilizer.Bypass.Desc="Disables the correction but keeps the crop zoom, to compare before/after."
VRStabilizer.Debug="Log statistics to the OBS log"
VRStabilizer.Group.Basic="Stabilization"
VRStabilizer.Group.Advanced="Advanced"
