VRStabilizer.Name="Estabilizador de cabeza VR"
VRStabilizer.Zoom="Zoom de recorte"
VRStabilizer.Zoom.Desc="Cuánto se amplía la imagen para ocultar los bordes que descubre la estabilización. Entre 4% y 6% funciona bien."
VRStabilizer.Strength="Intensidad"
VRStabilizer.Strength.Desc="Qué parte de la corrección calculada se aplica. 100% elimina la vibración por completo; valores menores conservan una fracción."
VRStabilizer.Smoothing="Suavizado"
VRStabilizer.Smoothing.Desc="Cuánto se suaviza el movimiento con la cabeza quieta. Más alto elimina vibraciones más lentas pero retrasa ligeramente el inicio de los movimientos intencionados."
VRStabilizer.Follow="Seguimiento en movimientos rápidos"
VRStabilizer.Follow.Desc="Velocidad (píxeles por fotograma) a partir de la cual se reduce el suavizado para que los giros de cabeza pasen 1:1 sin retardo."
VRStabilizer.Recenter="Tiempo de recentrado"
VRStabilizer.Recenter.Desc="Con qué rapidez la vista estabilizada vuelve a la vista real tras una corrección, en segundos."
VRStabilizer.MaxRotation="Corrección máxima de inclinación"
VRStabilizer.MaxRotation.Desc="Corrección máxima de la inclinación (roll) de la cabeza en grados. 0 desactiva la corrección de rotación."
VRStabilizer.AnalysisWidth="Resolución de análisis"
VRStabilizer.AnalysisWidth.Desc="Ancho de la imagen reducida usada para analizar el movimiento. Más alto es más preciso pero consume más CPU."
VRStabilizer.Bypass="Desactivar corrección (mostrar original con el mismo zoom)"
VRStabilizer.Bypass.Desc="Desactiva la corrección pero mantiene el zoom de recorte, para comparar antes y después."
VRStabilizer.Debug="Registrar estadísticas en el log de OBS"
VRStabilizer.Group.Basic="Estabilización"
VRStabilizer.Group.Advanced="Avanzado"
